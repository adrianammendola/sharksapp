<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <!-- Hacer que la app web ocupe toda la pantalla en móviles (incluido notch) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="tenis_shark_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>tenis_shark_app</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Que toda la página tenga el mismo fondo que la app y sin bordes grises */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #1A1A2E; /* mismo tono oscuro que el tema dark de la app */
    }

    body {
      overscroll-behavior-y: contain;
    }

    /* Asegurar que el contenedor de Flutter no agregue otro fondo raro */
    #flutter_host, #flutter-app, .flutter-view, canvas {
      background-color: transparent !important;
    }
  </style>
</head>
<body>
  <script>
    // Sistema de actualización automática del Service Worker
    // Esto detecta cuando hay una nueva versión y actualiza automáticamente
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        // Esperar a que Flutter cargue el service worker
        setTimeout(function() {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            registrations.forEach(function(registration) {
              // Verificar actualizaciones cada vez que se carga la app
              registration.update();
              
              // Escuchar cuando hay una nueva versión disponible
              registration.addEventListener('updatefound', function() {
                var newWorker = registration.installing;
                
                newWorker.addEventListener('statechange', function() {
                  // Cuando el nuevo service worker está listo
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    // Hay una nueva versión disponible, activarla automáticamente
                    newWorker.addEventListener('statechange', function() {
                      if (newWorker.state === 'activated') {
                        // Recargar la página para usar la nueva versión
                        window.location.reload();
                      }
                    });
                    // Activar el nuevo service worker inmediatamente
                    if (registration.waiting) {
                      registration.waiting.postMessage({ type: 'SKIP_WAITING' });
                    }
                  }
                });
              });
              
              // Escuchar mensajes del service worker
              navigator.serviceWorker.addEventListener('controllerchange', function() {
                // Cuando cambia el controlador, recargar para usar la nueva versión
                window.location.reload();
              });
            });
          });
          
          // También escuchar cuando se detecta un nuevo service worker
          navigator.serviceWorker.addEventListener('controllerchange', function() {
            window.location.reload();
          });
        }, 1000);
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
